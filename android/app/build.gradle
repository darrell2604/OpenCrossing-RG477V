plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.darrell2604.opencrossing'
    compileSdk 36

    defaultConfig {
        applicationId 'com.darrell2604.opencrossing'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-dev'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.31.6'
        }
    }
}

kotlinOptions {
    jvmTarget = '17'
}
